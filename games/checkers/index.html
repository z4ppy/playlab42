<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jeu de Dames - Playlab42</title>
  <link rel="stylesheet" href="../../lib/theme.css">
  <link rel="stylesheet" href="../../lib/ui.css">
  <link rel="stylesheet" href="../game-page.css">
  <style>
    /*
     * Mobile d'abord : titre, statut, damier et « Nouvelle Partie » tiennent dans
     * l'écran sans défiler ; le réglage des joueurs et l'aide clavier viennent après.
     * Le damier se dimensionne sur la largeur ET la hauteur visibles (dvh).
     */
    body {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(var(--space-sm), env(safe-area-inset-top))
        max(var(--space-md), env(safe-area-inset-right))
        max(var(--space-md), env(safe-area-inset-bottom))
        max(var(--space-md), env(safe-area-inset-left));
      overflow-x: hidden;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    h1 {
      font-size: var(--font-size-xl);
      line-height: 1.2;
    }

    .game-container {
      /* Hauteur réservée hors damier : titre, statut, boutons et marges. */
      --board-reserve: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      width: 100%;
      max-width: 36rem;
      margin-block: auto;
    }

    .info-panel {
      text-align: center;
      padding: var(--space-sm) var(--space-md);
      background: var(--color-bg-secondary);
      border-radius: var(--radius-md);
      width: min(100%, 32rem);
    }

    .status {
      font-size: var(--font-size-lg);
      font-weight: 600;
    }

    #move-message {
      font-size: var(--font-size-sm);
      line-height: 1.35;
      /* Deux lignes réservées : le damier ne saute pas quand le message change. */
      min-height: 2.7em;
      margin-top: var(--space-xs);
    }

    #captures-info:empty {
      display: none;
    }

    .player-turn {
      color: var(--color-accent);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      flex: none;
      width: min(500px, 100%);
      width: min(500px, 100%, max(260px, calc(100dvh - var(--board-reserve))));
      aspect-ratio: 1;
      gap: 0;
      border: 2px solid var(--color-border);
      background: #F5DEB3;
      /* Taper sans double-tap zoom ni sélection ; le défilement de page reste possible. */
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .square {
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      container-type: inline-size;
      touch-action: manipulation;
      transition: background-color 0.2s;
    }

    .square.dark {
      background: #8B4513;
    }

    .square.light {
      background: #F5DEB3;
      cursor: default;
    }

    .square.selected {
      outline: 3px solid #FFD700;
      outline-offset: -3px;
    }

    .square:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -4px;
      box-shadow: inset 0 0 0 6px #111;
      z-index: 1;
    }

    .square.possible-move {
      background-image: radial-gradient(circle, #90EE90 30%, transparent 30%);
    }

    .square.possible-move.dark {
      background-color: #8B4513;
      background-image: radial-gradient(circle, #90EE90 30%, transparent 30%);
    }

    .piece {
      /* 40px dans une case de 50px au bureau, proportionnel sur téléphone. */
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .piece.white {
      background: linear-gradient(145deg, #ffffff, #e0e0e0);
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    .piece.black {
      background: linear-gradient(145deg, #333, #111);
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }

    .piece.king::after {
      content: '♛';
      color: #FFD700;
      font-size: 20px;
      font-size: 56cqi;
      line-height: 1;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-sm);
      width: min(100%, 32rem);
    }

    .btn {
      min-height: 48px;
      padding: var(--space-sm) var(--space-lg);
      touch-action: manipulation;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-sm) var(--space-md);
      width: min(100%, 32rem);
    }

    .settings label {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--font-size-md);
    }

    .settings select {
      min-height: 44px;
      /* 16px minimum : pas de zoom automatique d'iOS au focus. */
      font-size: max(16px, var(--font-size-md));
      font-family: inherit;
      padding: 0 var(--space-sm);
      color: var(--color-text);
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      touch-action: manipulation;
    }

    #board-help {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      text-align: center;
      max-width: 32rem;
    }

    /* Survol réservé aux pointeurs qui survolent : pas d'effet « collé » au doigt. */
    @media (hover: hover) {
      .square:not(.light):hover .piece {
        transform: scale(1.1);
      }

      .btn-secondary:hover {
        background: var(--color-border);
      }
    }

    /* Écran tactile : l'aide clavier reste lue par aria-describedby, sans prendre de place. */
    @media (pointer: coarse) {
      #board-help {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    }

    /* Téléphone portrait : marges réduites pour agrandir les cases du 10x10. */
    @media (max-width: 480px) {
      body {
        padding-inline: max(var(--space-sm), env(safe-area-inset-left)) max(var(--space-sm), env(safe-area-inset-right));
      }

      h1 {
        font-size: var(--font-size-lg);
      }

      .game-container {
        --board-reserve: 230px;
        gap: var(--space-sm);
      }

      .controls .btn {
        flex: 1 1 0;
      }
    }

    /* Téléphone paysage : damier à gauche sur toute la hauteur, panneau à droite. */
    @media (orientation: landscape) and (max-height: 600px) {
      body {
        padding-block: max(var(--space-sm), env(safe-area-inset-top)) max(var(--space-sm), env(safe-area-inset-bottom));
      }

      .game-container {
        --board-size: min(
          calc(100dvh - 2 * var(--space-sm) - env(safe-area-inset-top) - env(safe-area-inset-bottom)),
          calc(100vw - 2 * var(--space-md) - 240px)
        );
        display: grid;
        grid-template-columns: var(--board-size) minmax(0, 22rem);
        grid-template-rows: auto auto auto auto 1fr;
        justify-content: center;
        align-items: start;
        column-gap: var(--space-md);
        row-gap: var(--space-sm);
        max-width: none;
      }

      .board {
        grid-column: 1;
        grid-row: 1 / -1;
        width: var(--board-size);
      }

      .game-container > :not(.board) {
        grid-column: 2;
        width: 100%;
      }

      h1 {
        font-size: var(--font-size-lg);
      }

      .controls .btn {
        flex: 1 1 0;
      }

      .settings {
        flex-direction: column;
        align-items: stretch;
      }

      .settings label {
        justify-content: space-between;
      }

      .settings select {
        flex: 1;
        max-width: 12rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🎲 Jeu de Dames</h1>

    <div class="info-panel">
      <div class="status" id="status" role="status" aria-live="polite">Tour du joueur Blanc</div>
      <div id="move-message" role="status" aria-live="polite"></div>
      <div id="captures-info"></div>
    </div>

    <div class="board" id="board" role="group" aria-label="Damier, dix lignes et dix colonnes" aria-describedby="board-help"></div>

    <div class="controls">
      <button class="btn" id="new-game">Nouvelle Partie</button>
      <button class="btn btn-primary" id="start-game" style="display:none;">Démarrer</button>
    </div>

    <div class="settings">
      <label>Joueur Blanc :
        <select id="white-player">
          <option value="human">Humain</option>
          <option value="random">Bot Random</option>
          <option value="smart">Bot Smart</option>
        </select>
      </label>
      <label>Joueur Noir :
        <select id="black-player">
          <option value="human">Humain</option>
          <option value="random">Bot Random</option>
          <option value="smart" selected>Bot Smart</option>
        </select>
      </label>
    </div>

    <p id="board-help">Flèches : parcourir le damier. Entrée ou Espace : sélectionner un pion puis sa destination. Au doigt ou à la souris : touchez un pion, puis une case indiquée.</p>
  </div>

  <script type="module">
    import { CheckersEngine } from './engine.js';
    import { initTheme } from '../../lib/theme.js';
    import GameKit from '../../lib/gamekit.js';
    import { createBoardNavigation } from '../board-navigation.js';
    import { renderCheckersBoard } from './ui/board-view.js';

    // Initialiser le thème (dark/light)
    initTheme();

    // Initialiser GameKit pour la communication avec le portail
    GameKit.init('checkers');

    const engine = new CheckersEngine();
    let state = null;
    let selectedSquare = null;
    let possibleMoves = [];
    const bots = { random: null, smart: null };
    const playerTypes = { 0: 'human', 1: 'smart' }; // Par défaut: Humain vs Bot
    let gameStarted = false; // Pour gérer le démarrage

    const statusEl = document.getElementById('status');
    const boardEl = document.getElementById('board');
    const navigation = createBoardNavigation(boardEl, 10);
    const moveMessage = document.getElementById('move-message');
    const newGameBtn = document.getElementById('new-game');
    const startGameBtn = document.getElementById('start-game');
    const whitePlayerSelect = document.getElementById('white-player');
    const blackPlayerSelect = document.getElementById('black-player');

    // Charger les bots
    async function loadBots() {
      try {
        const [RandomBot, SmartBot] = await Promise.all([
          import('./bots/random.js'),
          import('./bots/smart.js'),
        ]);
        bots.random = new RandomBot.default();
        bots.smart = new SmartBot.default();
      } catch (error) {
        console.error('Erreur chargement bots:', error);
        // Fallback: initialiser sans bots
        bots.random = null;
        bots.smart = null;
      }
    }

    // Initialiser une nouvelle partie
    function newGame() {
      console.log('Nouvelle partie...');
      try {
        state = engine.init({
          seed: Date.now(),
          playerIds: ['player1', 'player2'],
        });
        console.log('État initial:', state);
        selectedSquare = null;
        possibleMoves = [];
        moveMessage.textContent = '';
        playerTypes[0] = whitePlayerSelect.value;
        playerTypes[1] = blackPlayerSelect.value;
        console.log('Types de joueurs:', playerTypes);
        gameStarted = false;

        // Afficher le bouton Start si les blancs ne sont pas humains
        if (playerTypes[0] !== 'human') {
          startGameBtn.style.display = 'inline-block';
        } else {
          startGameBtn.style.display = 'none';
          gameStarted = true;
        }

        render();

        // Démarrer automatiquement si les blancs sont humains
        if (gameStarted) {
          checkBotTurn();
        }
      } catch (error) {
        console.error('Erreur lors de l\'initialisation:', error);
        // Pas d'alert() bloquante : le message reste lisible sous le statut, y compris sur téléphone.
        moveMessage.textContent = `Erreur : ${error.message}`;
      }
    }

    // Démarrer le jeu (pour bot vs bot ou bot vs humain quand bot commence)
    function startGame() {
      gameStarted = true;
      startGameBtn.style.display = 'none';
      checkBotTurn();
    }

    // Vérifier si c'est au tour d'un bot
    async function checkBotTurn() {
      if (state.status !== 'playing' || !gameStarted) {return;}

      const currentPlayerType = playerTypes[state.currentPlayer];
      if (currentPlayerType !== 'human') {
        // Attendre que les bots soient chargés
        if (!bots[currentPlayerType]) {
          console.log('En attente du chargement des bots...');
          await new Promise(resolve => setTimeout(resolve, 100));
          checkBotTurn(); // Réessayer
          return;
        }

        // Attendre un peu pour que le joueur voit le plateau
        await new Promise(resolve => setTimeout(resolve, 500));

        const bot = bots[currentPlayerType];
        try {
          const playerId = state.playerIds[state.currentPlayer];
          const validActions = engine.getValidActions(state, playerId);

          if (validActions.length > 0) {
            // Créer un RNG simple pour le bot
            const rng = {
              pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
            };

            const move = bot.chooseAction(state, validActions, rng);
            if (move) {
              state = engine.applyAction(state, move, playerId);
              render();
              // Continuer si c'est toujours un bot
              checkBotTurn();
            }
          }
        } catch (error) {
          console.error('Erreur bot:', error);
        }
      }
    }

    // Rendu du plateau
    function render() {
      navigation.beforeRender();
      renderCheckersBoard(boardEl, {
        state,
        selected: selectedSquare,
        moves: possibleMoves,
        humanTurn: playerTypes[state.currentPlayer] === 'human',
      }, handleSquareClick);
      updateStatus();
      navigation.afterRender();
    }

    // Gérer le clic sur une case
    function handleSquareClick(row, col) {
      if (state.status !== 'playing') {return;}

      // Bloquer si c'est le tour d'un bot
      const currentPlayerType = playerTypes[state.currentPlayer];
      if (currentPlayerType !== 'human') {return;}

      const piece = state.board[row][col];
      const currentPlayer = state.currentPlayer;

      // Si on clique sur une de nos pièces, la sélectionner
      if (piece && piece.player === currentPlayer) {
        selectedSquare = { row, col };
        const playerId = state.playerIds[currentPlayer];
        const allMoves = engine.getValidActions(state, playerId);
        possibleMoves = allMoves.filter(m => m.from.row === row && m.from.col === col);
        render();
        moveMessage.textContent = `${piece.type === 'king' ? 'Dame' : 'Pion'} sélectionné, ligne ${row + 1}, colonne ${col + 1}. ${possibleMoves.length} destination(s) autorisée(s).`;
        return;
      }

      // Si on a une pièce sélectionnée et qu'on clique sur un coup possible
      if (selectedSquare) {
        const move = possibleMoves.find(m => m.to.row === row && m.to.col === col);
        if (move) {
          try {
            const playerId = state.playerIds[currentPlayer];
            state = engine.applyAction(state, move, playerId);
            selectedSquare = null;
            possibleMoves = [];
            render();
            moveMessage.textContent = `Déplacement vers la ligne ${row + 1}, colonne ${col + 1}.`;
            checkBotTurn(); // Vérifier si c'est au tour d'un bot après
          } catch (error) {
            console.error('Erreur:', error);
            moveMessage.textContent = 'Mouvement invalide. Choisissez une destination autorisée.';
          }
        } else {
          moveMessage.textContent = 'Destination non autorisée. Choisissez une case indiquée ou un autre pion.';
        }
      }
    }

    // Mettre à jour le statut
    function updateStatus() {
      if (state.status === 'won') {
        const winnerName = state.winner === 0 ? 'Blanc' : 'Noir';
        statusEl.textContent = `🏆 Victoire du joueur ${winnerName}!`;
        statusEl.style.color = 'var(--color-success, green)';
        // Sauvegarder si le joueur humain a gagné
        if (playerTypes[state.winner] === 'human') {
          GameKit.saveScore(1);
        }
      } else if (state.status === 'draw') {
        statusEl.textContent = 'Match nul';
        statusEl.style.color = 'var(--color-warning, orange)';
      } else {
        const playerName = state.currentPlayer === 0 ? 'Blanc' : 'Noir';
        statusEl.textContent = `Tour du joueur ${playerName}`;
        statusEl.style.color = 'var(--color-text)';
      }
    }

    // Events
    newGameBtn.addEventListener('click', newGame);
    startGameBtn.addEventListener('click', startGame);

    // Initialisation
    loadBots().then(() => {
      newGame();
    });
  </script>
</body>
</html>
