<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go 9x9 - Playlab42</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="../../lib/ui.css">
    <style>
        :root {
            --board-size: min(80vmin, 720px);
            --cell-size: calc(var(--board-size) / 9);
        }

        body {
            font-family: var(--font-family);
            background: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-lg);
        }

        h1 {
            margin: 0;
            font-size: var(--font-size-xl);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: var(--space-xl);
            width: 100%;
            max-width: 1200px;
        }

        .panel {
            min-width: 0;
            background: var(--color-bg-secondary);
            padding: var(--space-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .board-wrapper {
            display: flex;
            justify-content: center;
        }

        .board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: min(var(--board-size), 100%);
            aspect-ratio: 1;
            box-sizing: border-box;
            background: #d2a15f;
            border: 6px solid #b58646;
            box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.1);
        }

        .cell {
            position: relative;
            width: 100%;
            height: 100%;
            background: transparent;
            cursor: pointer;
            padding: 0;
            border: none;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #000;
            z-index: 0;
        }

        .cell::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #000;
            z-index: 0;
        }

        .cell[data-x="0"]::before {
            left: 50%;
        }

        .cell[data-x="8"]::before {
            right: 50%;
        }

        .cell[data-y="0"]::after {
            top: 50%;
        }

        .cell[data-y="8"]::after {
            bottom: 50%;
        }

        .cell.hoshi::before {
            /* Ensure line is still drawn */
        }

        /* Hoshi dot using radial gradient on the cell itself, but we need to be careful not to hide lines if we use background-color.
           We use background-image. */
        .cell.hoshi {
            background-image: radial-gradient(circle at center, #000 3px, transparent 3.5px);
            background-repeat: no-repeat;
            background-position: center;
        }

        .cell:hover {
            background-color: rgba(0, 0, 0, 0.06);
        }

        .stone {
            position: absolute;
            inset: 8%;
            border-radius: 50%;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        .stone.black {
            background: #1a1a1a;
        }

        .stone.white {
            background: #f5f5f5;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .last-move .stone::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25%;
            height: 25%;
            border-radius: 50%;
            background: var(--color-accent);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .controls label {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        select,
        button {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            font-size: var(--font-size-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
        }

        .btn-primary {
            background: var(--color-accent);
            color: var(--color-text-inverse);
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: var(--color-accent-hover);
        }

        .status {
            font-size: var(--font-size-lg);
            margin-bottom: var(--space-md);
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
        }

        .card {
            padding: var(--space-md);
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
        }

        .scores {
            display: flex;
            justify-content: space-between;
            gap: var(--space-md);
        }

        .scores div {
            font-size: var(--font-size-md);
        }

        .legend {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            line-height: 1.4;
        }

        .cell:focus-visible {
            outline: 3px solid #fff;
            outline-offset: -4px;
            box-shadow: inset 0 0 0 6px #111;
            z-index: 2;
        }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }

            :root {
                --board-size: 92vw;
            }
        }
    </style>
    <script type="module">
        import { initTheme } from '../../lib/theme.js';
        initTheme();
    </script>
</head>

<body>
    <h1>⚫ Go 9x9</h1>
    <div class="layout">
        <div class="panel">
            <div class="status" id="status" role="status" aria-live="polite">Configurez et jouez</div>
            <div class="board-wrapper">
                <div class="board" id="board" role="group" aria-label="Plateau de Go, neuf lignes et neuf colonnes"></div>
            </div>
            <div class="legend" style="margin-top: var(--space-md);">
                Règles : ko simple, suicide interdit, scoring chinois (komi 6.5). Flèches : parcourir le plateau ; Entrée ou Espace : placer une pierre. Actions : placer, passer, résigner.
            </div>
        </div>

        <div class="panel">
            <div class="controls">
                <label for="bot-select">Adversaire</label>
                <select id="bot-select">
                    <option value="greedy">🤖 Tactique (défaut)</option>
                    <option value="random">🤖 Aléatoire (facile)</option>
                    <option value="human">👤 Hot-seat</option>
                </select>
                <button class="btn-primary" id="btn-start">Démarrer</button>
                <button id="btn-pass">Passer</button>
                <button id="btn-resign">Résigner</button>
                <button id="btn-reset">Reset</button>
            </div>

            <div class="meta" style="margin-top: var(--space-lg);">
                <div class="card">
                    <div>Captures Noir</div>
                    <strong id="captures-black">0</strong>
                </div>
                <div class="card">
                    <div>Captures Blanc</div>
                    <strong id="captures-white">0</strong>
                </div>
                <div class="card">
                    <div>Score Noir</div>
                    <strong id="score-black">-</strong>
                </div>
                <div class="card">
                    <div>Score Blanc</div>
                    <strong id="score-white">-</strong>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { $, on } from '../../lib/dom.js';
        import { SeededRandom } from '../../lib/seeded-random.js';
        import { Go9x9Engine } from './engine.js';
        import { RandomBot } from './bots/random.js';
        import { GreedyBot } from './bots/greedy.js';
        import { createBoardNavigation } from '../board-navigation.js';
        import { createHumanControls } from './human-controls.js';
        import { renderCell, scoreTexts, statusText } from './board-render.js';

        const boardEl = $('#board');
        const navigation = createBoardNavigation(boardEl, 9);
        const statusEl = $('#status');
        const capturesBlackEl = $('#captures-black');
        const capturesWhiteEl = $('#captures-white');
        const scoreBlackEl = $('#score-black');
        const scoreWhiteEl = $('#score-white');
        const botSelect = $('#bot-select');
        const btnStart = $('#btn-start');
        const btnPass = $('#btn-pass');
        const btnResign = $('#btn-resign');
        const btnReset = $('#btn-reset');

        const engine = new Go9x9Engine();
        const humanId = 'black';
        const opponentId = 'white';

        let state = null;
        let rng = null;
        let bot = null;
        const humanControls = createHumanControls({
            engine,
            getState: () => state,
            setState: next => { state = next; },
            hasBot: () => bot !== null,
            humanId,
            onUpdate: () => { render(); maybeBotTurn(); },
            onInvalid: () => {
                statusEl.textContent = 'Placement interdit : intersection occupée, ko ou suicide. Choisissez une autre intersection.';
            },
        });

        function buildBoard() {
            boardEl.innerHTML = '';
            const hoshis = ['2,2', '6,2', '4,4', '2,6', '6,6'];
            for (let y = 0; y < 9; y++) {
                for (let x = 0; x < 9; x++) {
                    const btn = document.createElement('button');
                    btn.className = 'cell';
                    if (hoshis.includes(`${x},${y}`)) {
                        btn.classList.add('hoshi');
                    }
                    btn.dataset.x = x;
                    btn.dataset.y = y;
                    on(btn, 'click', () => handleHumanMove(x, y));
                    boardEl.appendChild(btn);
                }
            }
            navigation.afterRender();
        }

        function startGame() {
            rng = new SeededRandom(Date.now());
            const seed = rng.getState();

            const playerIds = [humanId, opponentId];
            state = engine.init({ seed, playerIds });

            const opponent = botSelect.value;
            if (opponent === 'human') {
                bot = null;
            } else {
                bot = opponent === 'greedy' ? new GreedyBot() : new RandomBot();
                bot.onGameStart(opponentId, state);
            }

            render();

            if (state.currentPlayerId === opponentId && bot) {
                setTimeout(playBot, 300);
            }
        }

        function handleHumanMove(x, y) {
            humanControls.play({ type: 'place', x, y });
        }

        function maybeBotTurn() {
            if (!bot || state.gameOver) {return;}
            if (state.currentPlayerId !== opponentId) {return;}
            setTimeout(playBot, 150);
        }

        function playBot() {
            if (!bot || state.gameOver || state.currentPlayerId !== opponentId) {return;}
            const valid = engine.getValidActions(state, opponentId);
            const action = bot.chooseAction(state, valid, rng);
            state = engine.applyAction(state, action, opponentId);
            render();
        }

        function pass() {
            humanControls.play({ type: 'pass' });
        }

        function resign() {
            humanControls.play({ type: 'resign' });
        }

        function render() {
            if (!state) {return;}
            const currentHuman = humanControls.getPlayerId();
            btnPass.disabled = currentHuman === null;
            btnResign.disabled = currentHuman === null;

            boardEl.querySelectorAll('.cell').forEach((cell) => {
                renderCell(cell, state, currentHuman !== null, document);
            });

            const captures = state.captures || {};
            capturesBlackEl.textContent = captures[humanId] ?? 0;
            capturesWhiteEl.textContent = captures[opponentId] ?? 0;

            const scores = scoreTexts(state);
            scoreBlackEl.textContent = scores.black;
            scoreWhiteEl.textContent = scores.white;
            statusEl.textContent = statusText(state, { humanId, opponentId, bot, currentHuman });
        }

        on(btnStart, 'click', startGame);
        on(btnPass, 'click', pass);
        on(btnResign, 'click', resign);
        on(btnReset, 'click', startGame);

        buildBoard();
        startGame();
    </script>
</body>

</html>
