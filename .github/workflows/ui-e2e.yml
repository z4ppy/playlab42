name: UI browser

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      prebuilt:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.prebuilt }}

jobs:
  browser:
    name: Chromium interactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Archive construite par la CI
        if: inputs.prebuilt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Extraire le site sans le reconstruire
        if: inputs.prebuilt
        run: |
          mkdir -p site
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C site
      - name: Real browser suite
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PREBUILT: ${{ inputs.prebuilt && '1' || '0' }}
      - name: Failure report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-e2e-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
