# Workflow d'audit de sécurité
# Analyse les vulnérabilités dans le code et les dépendances

name: Security Audit

on:
  # Exécuté sur chaque push et pull request
  push:
    branches: [main]
  pull_request: {}

  # Exécuté quotidiennement à 6h UTC pour détecter de nouvelles CVE
  schedule:
    - cron: '0 6 * * *'

  # Permet le déclenchement manuel
  workflow_dispatch:

# Permissions minimales (principe du moindre privilège)
permissions:
  contents: read

jobs:
  # Job 1 : Audit des dépendances npm
  npm-audit:
    name: Audit dépendances npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Audit npm (niveau modéré et au-dessus)
        run: npm run --silent audit:dependencies -- --json > npm-audit-results.json

      - name: Upload des résultats npm audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          if-no-files-found: error
          retention-days: 30

  # Job 2 : Analyse statique avec ESLint Security
  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Analyse ESLint avec règles de sécurité
        run: npm run lint:security -- --format json --output-file eslint-security-results.json

      - name: Upload des résultats ESLint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eslint-security-results
          path: eslint-security-results.json
          if-no-files-found: error
          retention-days: 30

  # Job 3 : Scan avec Trivy (vulnérabilités et secrets)
  trivy-scan:
    name: Trivy Security Scan
    uses: ./.github/workflows/trivy-scan.yml
    with:
      artifact-name: audit-trivy-results

  # Job 4 : Détection de secrets avec GitLeaks
  gitleaks:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Nécessaire pour analyser l'historique git

      - name: Installation de GitLeaks
        run: bash scripts/install-security-scanner.sh gitleaks

      - name: Scan GitLeaks (historique, rapport expurgé)
        run: gitleaks git . --redact --gitleaks-ignore-path .gitleaksignore --report-format json --report-path gitleaks-results.json --log-level warn

      - name: Upload du rapport GitLeaks expurgé
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-results
          path: gitleaks-results.json
          if-no-files-found: error
          retention-days: 30

  # Job 5 : Vérification des mises à jour de sécurité disponibles
  outdated-check:
    name: Packages obsolètes (consultatif)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérifier les packages obsolètes
        run: |
          echo "📦 État consultatif des versions ; l'audit npm bloquant reste dans son job dédié."
          if npm outdated; then
            echo "Aucune version obsolète signalée."
          else
            status=$?
            echo "::warning::npm outdated a terminé avec le code $status (consultatif, pas un audit de sécurité réussi)."
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi

  # Job 6 : Analyse de la configuration Docker
  docker-security:
    name: Sécurité Docker (consultatif)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            category: hadolint-dev
          - dockerfile: docker/e2e.Dockerfile
            category: hadolint-e2e
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan du Dockerfile avec Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload des résultats Hadolint vers Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: ${{ matrix.category }}

      - name: Archive Hadolint (consultatif, pas une certification de sécurité)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.category }}
          path: hadolint-results.sarif
          if-no-files-found: error
          retention-days: 30

  # Job 7 : Rapport consolidé
  security-report:
    name: Rapport consolidé
    runs-on: ubuntu-latest
    needs: [npm-audit, eslint-security, trivy-scan, gitleaks, outdated-check, docker-security]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'

      - name: Générer le rapport consolidé
        env:
          SECURITY_JOB_RESULTS: ${{ toJSON(needs) }}
          REPORT_BRANCH: ${{ github.ref_name }}
        run: node scripts/build-security-report.js > security-report.md

      - name: Upload du rapport consolidé
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-report
          path: security-report.md
          if-no-files-found: error
          retention-days: 90

      - name: Afficher le rapport
        run: |
          cat security-report.md
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commenter la PR avec le rapport
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
