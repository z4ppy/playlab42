# Workflow de déploiement GitHub Pages
# Valide, teste puis publie la même archive sur GitHub Pages.

name: Deploy to GitHub Pages

on:
  # Déclenché sur push vers main
  push:
    branches: [main]

  # Permet le déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

# Permissions nécessaires pour GitHub Pages
permissions:
  contents: read

# Un seul déploiement à la fois
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-ref:
    runs-on: ubuntu-latest
    steps:
      - name: La production vient uniquement de main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::La publication est réservée à main."
            exit 1
          fi

  validate:
    needs: check-ref
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job de déploiement
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v6
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Published site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Vérifier le commit et les ressources publiées
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/check-deployment.js "$DEPLOYMENT_URL" "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Propagation Pages : tentative $attempt échouée, nouvel essai dans 10 s."
              sleep 10
            fi
          done
          echo "::error::La publication n'a pas passé le contrôle HTTP."
          exit 1
