# Workflow CI - Lint, Tests et Coverage
# Appelé sur PR, manuellement ou par le workflow de déploiement

name: CI

on:
  pull_request: {}
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      lint: ${{ steps.plan.outputs.lint }}
      security-lint: ${{ steps.plan.outputs.security-lint }}
      test: ${{ steps.plan.outputs.test }}
      code-quality: ${{ steps.plan.outputs.code-quality }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      openspec: ${{ steps.plan.outputs.openspec }}
      browser: ${{ steps.plan.outputs.browser }}
      runner: ${{ steps.plan.outputs.runner }}
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        id: node
        with:
          node-version: '26'
      - name: Selectionner les controles et verifier les preuves originales
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CI_NODE_VERSION: ${{ steps.node.outputs.node-version }}
        with:
          script: |
            const fs = require('fs');
            const { planCi, controls } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-plan.js`);
            const { reuseCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-reuse.js`);
            const { renderPlan } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-evidence.js`);
            const runner = {
              node: process.env.CI_NODE_VERSION.replace(/^v/, ''),
              image: `${process.env.ImageOS}-${process.env.ImageVersion}`,
              arch: process.arch,
            };
            const plan = planCi({
              eventName: context.eventName, event: context.payload,
              root: process.env.GITHUB_WORKSPACE, commit: context.sha,
              runner, repository: `${context.repo.owner}/${context.repo.repo}`, warn: core.warning,
            });
            await reuseCi(plan, {
              github, root: process.env.GITHUB_WORKSPACE,
              currentRunId: context.runId, warn: core.warning,
            });
            for (const id of controls) core.setOutput(id, plan.controls[id].mode);
            core.setOutput('runner', JSON.stringify(runner));
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/ci-plan.json`, JSON.stringify(plan, null, 2));
            await core.summary.addRaw(renderPlan(plan)).write();
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan.json
          if-no-files-found: error
          retention-days: 30

  trivy-scan:
    name: Trivy Security Scan
    uses: ./.github/workflows/trivy-scan.yml
    with:
      artifact-name: ci-trivy-results

  security-lint:
    name: Security lint
    needs: impact
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      eligible: ${{ steps.decision.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.impact.outputs.node-version }}
          cache: npm
      - name: Decision du controle
        id: decision
        run: node scripts/ci-evidence.js start
        env:
          CI_MODE: ${{ needs.impact.outputs.security-lint }}
          CI_RUNNER: ${{ needs.impact.outputs.runner }}
      - run: npm ci
        if: steps.decision.outputs.mode == 'execute'
      - run: npm run lint:security -- --format json --output-file eslint-security-results.json
        if: steps.decision.outputs.mode == 'execute'
      - name: Rapport de lint sécurité
        if: always() && steps.decision.outputs.mode == 'execute'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-eslint-security-results
          path: eslint-security-results.json
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  # Job de linting
  lint:
    name: Lint
    needs: impact
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      eligible: ${{ steps.decision.outputs.eligible }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.impact.outputs.node-version }}
          cache: 'npm'

      - name: Decision du controle
        id: decision
        run: node scripts/ci-evidence.js start
        env:
          CI_MODE: ${{ needs.impact.outputs.lint }}
          CI_RUNNER: ${{ needs.impact.outputs.runner }}
      - name: Installation des dépendances
        if: steps.decision.outputs.mode == 'execute'
        run: npm ci

      - name: Lint JS, scripts HTML et TypeScript
        if: steps.decision.outputs.mode == 'execute'
        run: npm run lint

  # Job de tests avec coverage
  test:
    name: Tests
    needs: impact
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      eligible: ${{ steps.decision.outputs.eligible }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.impact.outputs.node-version }}
          cache: 'npm'

      - name: Decision du controle
        id: decision
        run: node scripts/ci-evidence.js start
        env:
          CI_MODE: ${{ needs.impact.outputs.test }}
          CI_RUNNER: ${{ needs.impact.outputs.runner }}
      - name: Installation des dépendances
        if: steps.decision.outputs.mode == 'execute' || steps.decision.outputs.mode == 'documentation'
        run: npm ci
      - name: Contrats documentaires sans faux rapport de couverture complete
        if: steps.decision.outputs.mode == 'documentation'
        run: |
          node --input-type=module -e "
            import { spawnSync } from 'node:child_process';
            import { documentaryTests } from './scripts/ci-plan.js';
            const result = spawnSync('npm', ['test', '--', '--runInBand', '--runTestsByPath', ...documentaryTests], { stdio: 'inherit' });
            if (result.error) throw result.error;
            process.exit(result.status ?? 1);
          "

      - name: Tests avec coverage
        id: jest
        if: steps.decision.outputs.mode == 'execute'
        run: npm run test:coverage

      - name: Résumé et provenance des preuves Jest
        if: always() && steps.decision.outputs.mode == 'execute'
        env:
          TEST_OUTCOME: ${{ steps.jest.outcome }}
        run: |
          mkdir -p coverage
          node scripts/coverage-report.js

      - name: Archiver les preuves Jest (même après échec)
        if: always() && steps.decision.outputs.mode == 'execute'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jest-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
            coverage/lcov.info
            coverage/provenance.json
            coverage/coverage-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage vers Codecov
        if: always() && steps.decision.outputs.mode == 'execute'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: playlab42-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  code-quality:
    name: Code quality
    needs: impact
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      eligible: ${{ steps.decision.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.impact.outputs.node-version }}
          cache: npm
      - name: Decision du controle
        id: decision
        run: node scripts/ci-evidence.js start
        env:
          CI_MODE: ${{ needs.impact.outputs.code-quality }}
          CI_RUNNER: ${{ needs.impact.outputs.runner }}
      - run: npm ci
        if: steps.decision.outputs.mode == 'execute'
      - name: Mesurer duplication et complexité
        if: steps.decision.outputs.mode == 'execute'
        run: npm run quality:report
      - name: Archiver le rapport de qualité
        if: always() && steps.decision.outputs.mode == 'execute'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-quality-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/code-quality/code-quality.json
            coverage/code-quality/code-quality.md
          if-no-files-found: error
          retention-days: 30

  # Job de vérification TypeScript
  typecheck:
    name: TypeScript
    needs: impact
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      eligible: ${{ steps.decision.outputs.eligible }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.impact.outputs.node-version }}
          cache: 'npm'

      - name: Decision du controle
        id: decision
        run: node scripts/ci-evidence.js start
        env:
          CI_MODE: ${{ needs.impact.outputs.typecheck }}
          CI_RUNNER: ${{ needs.impact.outputs.runner }}
      - name: Installation des dépendances
        if: steps.decision.outputs.mode == 'execute'
        run: npm ci

      - name: Vérification des types
        if: steps.decision.outputs.mode == 'execute'
        run: npm run typecheck

  # Job de build (vérifie que le build fonctionne)
  build:
    name: Build
    needs: [impact, security-lint, trivy-scan, code-quality]
    # Un job ignoré satisfait la protection GitHub : échouer explicitement plutôt que sauter Build.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Exiger le succès des gates de sécurité et de qualité
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          SECURITY_LINT_RESULT: ${{ needs.security-lint.result }}
          TRIVY_SCAN_RESULT: ${{ needs.trivy-scan.result }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::Le contrôle $1 doit réussir (statut : $2)."
              exit 1
            fi
          }
          require_success impact "$IMPACT_RESULT"
          require_success security-lint "$SECURITY_LINT_RESULT"
          require_success trivy-scan "$TRIVY_SCAN_RESULT"
          require_success code-quality "$CODE_QUALITY_RESULT"

      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          npm run build
          npm run verify:site
          cp site/build-manifest.json "$RUNNER_TEMP/first-build-manifest.json"
          npm run build
          cmp "$RUNNER_TEMP/first-build-manifest.json" site/build-manifest.json
          npm run verify:site
          npm run check:recovery

      - name: Archive du site public
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
          retention-days: 7

  openspec:
    name: OpenSpec
    needs: impact
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      eligible: ${{ steps.decision.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.impact.outputs.node-version }}
          cache: npm
      - name: Decision du controle
        id: decision
        run: node scripts/ci-evidence.js start
        env:
          CI_MODE: ${{ needs.impact.outputs.openspec }}
          CI_RUNNER: ${{ needs.impact.outputs.runner }}
      - run: npm ci
        if: steps.decision.outputs.mode == 'execute'
      - run: npm run openspec:validate
        if: steps.decision.outputs.mode == 'execute'
        env:
          OPENSPEC_TELEMETRY: '0'

  browser:
    name: Browser
    needs: [impact, trivy-scan, dependency-audit, security-lint, lint, test, code-quality, typecheck, openspec, build]
    if: always()
    uses: ./.github/workflows/ui-e2e.yml
    with:
      prebuilt: true
      mode: ${{ needs.impact.outputs.browser }}
      runner: ${{ needs.impact.outputs.runner }}
      node-version: ${{ needs.impact.outputs.node-version }}
      gates: ${{ toJSON(needs) }}
