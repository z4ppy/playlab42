# Workflow CI - Lint, Tests et Coverage
# Appelé sur PR, manuellement ou par le workflow de déploiement

name: CI

on:
  pull_request: {}
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    uses: ./.github/workflows/trivy-scan.yml
    with:
      artifact-name: ci-trivy-results

  security-lint:
    name: Security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint:security -- --format json --output-file eslint-security-results.json
      - name: Rapport de lint sécurité
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-eslint-security-results
          path: eslint-security-results.json
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  # Job de linting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Lint JS, scripts HTML et TypeScript
        run: npm run lint

  # Job de tests avec coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Tests avec coverage
        id: jest
        run: npm run test:coverage

      - name: Résumé et provenance des preuves Jest
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.jest.outcome }}
        run: |
          mkdir -p coverage
          node scripts/coverage-report.js

      - name: Archiver les preuves Jest (même après échec)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jest-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
            coverage/lcov.info
            coverage/provenance.json
            coverage/coverage-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage vers Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: playlab42-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Mesurer duplication et complexité
        run: npm run quality:report
      - name: Archiver le rapport de qualité
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-quality-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/code-quality/code-quality.json
            coverage/code-quality/code-quality.md
          if-no-files-found: error
          retention-days: 30

  # Job de vérification TypeScript
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

  # Job de build (vérifie que le build fonctionne)
  build:
    name: Build
    needs: [security-lint, trivy-scan, code-quality]
    # Un job ignoré satisfait la protection GitHub : échouer explicitement plutôt que sauter Build.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Exiger le succès des gates de sécurité et de qualité
        shell: bash
        env:
          SECURITY_LINT_RESULT: ${{ needs.security-lint.result }}
          TRIVY_SCAN_RESULT: ${{ needs.trivy-scan.result }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::Le contrôle $1 doit réussir (statut : $2)."
              exit 1
            fi
          }
          require_success security-lint "$SECURITY_LINT_RESULT"
          require_success trivy-scan "$TRIVY_SCAN_RESULT"
          require_success code-quality "$CODE_QUALITY_RESULT"

      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          npm run build
          npm run verify:site
          cp site/build-manifest.json "$RUNNER_TEMP/first-build-manifest.json"
          npm run build
          cmp "$RUNNER_TEMP/first-build-manifest.json" site/build-manifest.json
          npm run verify:site
          npm run check:recovery

      - name: Archive du site public
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
          retention-days: 7

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run openspec:validate
        env:
          OPENSPEC_TELEMETRY: '0'

  browser:
    name: Browser
    needs: build
    uses: ./.github/workflows/ui-e2e.yml
    with:
      prebuilt: true
