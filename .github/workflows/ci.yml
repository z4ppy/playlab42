# Workflow CI - Lint, Tests et Coverage
# Appelé sur PR, manuellement ou par le workflow de déploiement

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  # Job de linting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

  # Job de tests avec coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Tests avec coverage
        run: npm run test:coverage

      - name: Upload coverage vers Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: playlab42-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job de vérification TypeScript
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

  # Job de build (vérifie que le build fonctionne)
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Archive du site public
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run openspec:validate
        env:
          OPENSPEC_TELEMETRY: '0'

  browser:
    name: Browser
    needs: build
    uses: ./.github/workflows/ui-e2e.yml
    with:
      prebuilt: true
