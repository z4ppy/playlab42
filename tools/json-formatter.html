<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter - Playlab42</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <link rel="stylesheet" href="../lib/ui.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    header {
      padding: var(--space-md);
      background: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }

    header h1 {
      font-size: var(--font-size-lg);
      font-weight: 600;
    }

    header h1 span {
      color: var(--color-accent);
    }

    .actions {
      display: flex;
      gap: var(--space-sm);
    }

    button {
      padding: var(--space-sm) var(--space-md);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: var(--font-size-sm);
      font-weight: 500;
      transition: all var(--transition-normal);
    }

    button.primary {
      background: var(--color-accent);
      color: var(--color-text-inverse);
    }

    button.primary:hover {
      background: var(--color-accent-hover);
    }

    button.secondary {
      background: var(--color-bg);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    button.secondary:hover {
      background: var(--color-border);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      min-height: 26rem;
      min-width: 0;
      background: var(--color-border);
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    .panel {
      min-width: 0;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition-normal);
    }

    .panel-header {
      padding: 0.75rem var(--space-md);
      background: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }

    @media (max-width: 480px) {
      header, footer { flex-wrap: wrap; gap: var(--space-sm); }
      .actions { flex-wrap: wrap; }
      textarea { min-height: 14rem; }
    }

    .panel-header h2 {
      font-size: var(--font-size-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .status {
      font-size: var(--font-size-xs);
      padding: var(--space-xs) var(--space-sm);
      border-radius: 3px;
    }

    .status.valid {
      background: var(--color-success-light);
      color: var(--color-success);
    }

    .status.invalid {
      background: var(--color-error-light);
      color: var(--color-error);
    }

    textarea {
      flex: 1;
      padding: var(--space-md);
      background: var(--color-bg);
      border: none;
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    textarea::placeholder {
      color: var(--color-text-muted);
    }

    textarea:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: -3px;
    }

    .output {
      flex: 1;
      padding: var(--space-md);
      overflow: auto;
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output.error {
      color: var(--color-error);
    }

    /* Coloration syntaxique */
    .string { color: var(--color-syntax-string); }
    .number { color: var(--color-syntax-number); }
    .boolean { color: var(--color-syntax-boolean); }
    .null { color: var(--color-syntax-null); }
    .key { color: var(--color-syntax-key); }

    footer {
      padding: var(--space-sm) var(--space-md);
      background: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      display: flex;
      justify-content: space-between;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }

    .kbd {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }
  </style>
  <script type="module">
    import { initTheme } from '../lib/theme.js';
    initTheme();
  </script>
</head>
<body>
  <header>
    <h1><span>📋</span> JSON Formatter</h1>
    <div class="actions">
      <button class="secondary" id="btn-minify">Minifier</button>
      <button class="secondary" id="btn-copy">Copier</button>
      <button class="primary" id="btn-format">Formater</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-header">
        <h2><label for="input">Entrée JSON</label></h2>
        <span class="status" id="status" role="status" aria-atomic="true"></span>
      </div>
      <textarea
        id="input"
        placeholder="Collez votre JSON ici..."
        spellcheck="false"
        aria-describedby="status"
      ></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 id="output-title">Sortie</h2>
        <span id="size"></span>
      </div>
      <div class="output" id="output" role="region" aria-labelledby="output-title" tabindex="0"></div>
    </div>
  </main>

  <footer>
    <span>Playlab42 - JSON Formatter</span>
    <span><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> pour formater</span>
  </footer>
  <p id="copy-status" role="status" aria-atomic="true"></p>

  <script type="module">
    import { $, on, debounce, escapeHtml } from '../lib/dom.js';

    // Éléments DOM
    const inputEl = $('#input');
    const outputEl = $('#output');
    const statusEl = $('#status');
    const sizeEl = $('#size');
    const btnFormat = $('#btn-format');
    const btnMinify = $('#btn-minify');
    const btnCopy = $('#btn-copy');

    // État
    let lastValidJSON = null;
    let hasValidJSON = false;
    const indentSize = 2;
    const autoFormat = debounce(formatJSON, 300);

    /**
     * Applique la coloration syntaxique au JSON (sans innerHTML dangereux)
     */
    function highlightJSON(json) {
      // Une seule passe sur les jetons JSON évite de recolorer les balises générées.
      return json.replace(/"(?:\\.|[^"\\])*"(?:\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g, (token) => {
        let type = 'number';
        if (token.startsWith('"')) {
          type = token.endsWith(':') ? 'key' : 'string';
        } else if (token === 'null') {
          type = 'null';
        } else if (token === 'true' || token === 'false') {
          type = 'boolean';
        }
        return `<span class="${type}">${escapeHtml(token)}</span>`;
      });
    }

    /**
     * Formate le JSON avec indentation
     */
    function formatJSON() {
      autoFormat.cancel();
      const input = inputEl.value.trim();
      hasValidJSON = false;
      inputEl.removeAttribute('aria-invalid');

      if (!input) {
        outputEl.innerHTML = '';
        outputEl.classList.remove('error');
        statusEl.textContent = '';
        statusEl.className = 'status';
        sizeEl.textContent = '';
        return;
      }

      try {
        const parsed = JSON.parse(input);
        lastValidJSON = parsed;
        hasValidJSON = true;
        const formatted = JSON.stringify(parsed, null, indentSize);

        outputEl.innerHTML = highlightJSON(formatted);
        outputEl.classList.remove('error');

        statusEl.textContent = 'Valide ✓';
        statusEl.className = 'status valid';

        const bytes = new Blob([formatted]).size;
        sizeEl.textContent = formatBytes(bytes);
      } catch (e) {
        inputEl.setAttribute('aria-invalid', 'true');
        outputEl.textContent = `Erreur de syntaxe:\n${e.message}`;
        outputEl.classList.add('error');

        statusEl.textContent = 'Invalide ✗';
        statusEl.className = 'status invalid';
        sizeEl.textContent = '';
      }
    }

    /**
     * Minifie le JSON
     */
    function minifyJSON() {
      formatJSON();
      if (!hasValidJSON) {return;}

      const minified = JSON.stringify(lastValidJSON);
      outputEl.innerHTML = highlightJSON(minified);
      outputEl.classList.remove('error');

      const bytes = new Blob([minified]).size;
      sizeEl.textContent = formatBytes(bytes);
    }

    /**
     * Copie le résultat dans le presse-papiers
     */
    async function copyOutput() {
      const text = outputEl.textContent;
      if (!text) {return;}

      try {
        await navigator.clipboard.writeText(text);
        const originalText = btnCopy.textContent;
        btnCopy.textContent = 'Copié !';
        $('#copy-status').textContent = 'Résultat copié dans le presse-papiers.';
        setTimeout(() => {
          btnCopy.textContent = originalText;
        }, 1500);
      } catch (e) {
        $('#copy-status').textContent = 'Copie impossible. Sélectionnez le résultat pour le copier manuellement.';
        console.error('Erreur copie:', e);
      }
    }

    /**
     * Formate une taille en bytes
     */
    function formatBytes(bytes) {
      if (bytes < 1024) {return `${bytes} B`;}
      if (bytes < 1024 * 1024) {return `${(bytes / 1024).toFixed(1)} KB`;}
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    // Event listeners
    on(btnFormat, 'click', formatJSON);
    on(btnMinify, 'click', minifyJSON);
    on(btnCopy, 'click', copyOutput);

    // Auto-format au fur et à mesure (débounce)
    on(inputEl, 'input', autoFormat);

    // Raccourci clavier Ctrl+Enter
    on(inputEl, 'keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        formatJSON();
      }
    });

    // Charger depuis l'URL si présent
    const urlParams = new URLSearchParams(window.location.search);
    const jsonParam = urlParams.get('json');
    if (jsonParam) {
      try {
        inputEl.value = decodeURIComponent(jsonParam);
        formatJSON();
      } catch (e) {
        console.error('Erreur chargement JSON depuis URL:', e);
      }
    }

    // Focus initial
    inputEl.focus();
  </script>
</body>
</html>
